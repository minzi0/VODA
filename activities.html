<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Activities | VODA</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body class="activities-page">
  <header id="site-header" class="site-header"></header>

  <main>
    <!-- 얇은 상단 배너 -->
    <section class="activities-banner">
      <div class="wrap">
        <h1>Activities</h1>
      </div>
    </section>

    <div class="wrap activities-list">

      <!-- 첫 번째 활동 -->
      <article class="activity-row">
        <div
          class="activity-slider"
          role="region"
          aria-roledescription="캐러셀"
          aria-label="첫 번째 활동 사진"
        >
          <div class="activity-slides">

            <div class="activity-slide">
              <div class="activity-photo-placeholder">
                <span aria-hidden="true">▧</span>
                <p>사진이 들어갈 자리 1</p>
              </div>

              <!-- 사진을 넣을 때 위 placeholder div를 지우고
                   아래 img의 주석을 해제하세요. -->
              <!--
              <img
                src="images/activity-01-01.jpg"
                alt="첫 번째 활동 사진 설명"
              >
              -->
            </div>

            <div class="activity-slide" hidden>
              <div class="activity-photo-placeholder">
                <span aria-hidden="true">▧</span>
                <p>사진이 들어갈 자리 2</p>
              </div>

              <!--
              <img
                src="images/activity-01-02.jpg"
                alt="첫 번째 활동의 두 번째 사진 설명"
              >
              -->
            </div>

            <div class="activity-slide" hidden>
              <div class="activity-photo-placeholder">
                <span aria-hidden="true">▧</span>
                <p>사진이 들어갈 자리 3</p>
              </div>

              <!--
              <img
                src="images/activity-01-03.jpg"
                alt="첫 번째 활동의 세 번째 사진 설명"
              >
              -->
            </div>

          </div>

          <button
            class="activity-arrow activity-prev"
            type="button"
            aria-label="이전 사진"
          >‹</button>

          <button
            class="activity-arrow activity-next"
            type="button"
            aria-label="다음 사진"
          >›</button>

          <div class="activity-dots" aria-label="사진 선택"></div>
          <p class="activity-status sr-only" aria-live="polite"></p>
        </div>

        <div class="activity-copy">
          <h2>
            <!-- 실제 활동 제목을 넣으세요. -->
            활동 제목

            <!-- 실제 활동 설명을 넣으세요. -->
            활동 설명이 들어갈 자리입니다.
