<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Apply | VODA</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body class="apply-page">
  <header id="site-header" class="site-header"></header>

  <main>
    <!-- 얇은 상단 배너 -->
    <section class="apply-banner">
      <div class="wrap">
        <h1>Apply</h1>
      </div>
    </section>

    <!-- 모집 기간 안내 -->
    <section class="apply-closed" aria-labelledby="recruitment-title">
      <div class="wrap apply-closed-grid">

        <div class="apply-closed-copy">
          <span class="apply-kicker">RECRUITMENT</span>

          <h2 id="recruitment-title">
            현재 모집 기간이 아닙니다
          </h2>

          <p>
            모집 소식은
            <a href="board.html" class="apply-board-link">Board</a>/인스타그램에서
            확인해주세요.
          </p>

          <a
            class="apply-instagram-button"
            href="https://www.instagram.com/voda_data_ai?stkn=Z3V0NTE4eHNnbDI4"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg
              width="23"
              height="23"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              aria-hidden="true"
            >
              <rect
                x="3"
                y="3"
                width="18"
                height="18"
                rx="5"
              ></rect>
              <circle cx="12" cy="12" r="4"></circle>
              <circle
                cx="17.5"
                cy="6.5"
                r="1"
                fill="currentColor"
                stroke="none"
              ></circle>
            </svg>

            <span>VODA인스타그램 바로가기</span>
            <span aria-hidden="true">→</span>
            <span class="apply-sr-only">새 탭에서 열림</span>
          </a>
        </div>

        <div class="apply-closed-art">
          <img
            src="images/apply-closed.png"
            alt="CLOSED 노트를 들고 있는 VODA 캐릭터"
          >
        </div>

      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
